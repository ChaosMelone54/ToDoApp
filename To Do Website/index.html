<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Easy Task</title>
        <link rel="stylesheet", href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_2" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=chevron_backward" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=chevron_forward" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=edit" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
    </head>
    <body>
        <div class="container">
            <div class="ToDo">
                <h1>Easy Task</h1>
                <div class="stat-container">
                    <div class="details">
                        <h3>Keep it Up</h3>
                        <div id="progressbar">
                            <div id="progress"></div>
                        </div>
                    </div>
                    <div class="stats-number">
                        <p id="numbers">0 / 0</p>
                    </div>
                </div>
                <form action="" class="input-area">
                    <input type="text" placeholder="Add a new task ..." id="task-input">
                    <select name="priority" id="priority">
                        <option value="Dringend">Dringend</option>
                        <option value="Dringend">Wichtig</option>
                        <option value="Dringend">Mittel</option>
                        <option value="Dringend">Niedrig</option>
                    </select>
                    <input type="date" name="date" id="date">
                    <button type="submit" id="addTaskBtn"><span class="material-symbols-outlined">add_2</span></button>
                    <label id="morelist">Neue Liste</label>
                    <button><span class="material-symbols-outlined">chevron_backward</span></button>
                    <button><span class="material-symbols-outlined">chevron_forward</span></button>
                </form>
                <div class="todos-container">
                    <ul id="task-list"></ul>
                    <img src="task.png" class="empty-image" alt="empty">
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
