<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Easy Task</title>
        <link rel="stylesheet", href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    </head>
    <body>
        <div class="container">
            <div class="ToDo">
                <h1>Easy Task</h1>
                <div class="stat-container">
                    <div class="details">
                        <h3>Keep it Up</h3>
                        <div id="progressbar">
                            <div id="progress"></div>
                        </div>
                    </div>
                    <div class="stats-number">
                        <p id="numbers">0 / 0</p>
                    </div>
                </div>
                <form action="" class="input-area">
                    <input type="text" placeholder="Add a new task ..." id="task-input">
                    <select name="priority" id="priority">
                        <option value="Dringend">Dringend</option>
                        <option value="Wichtig">Wichtig</option>
                        <option value="Mittel">Mittel</option>
                        <option value="Niedrig">Niedrig</option>
                    </select>
                    <input type="date" name="date" id="date">
                    <button id="addTaskBtn"><img src="add_2_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"></button>
                    <label id="morelist" onclick="showAddList()">My Tasks</label>
                    <button id="backwardbtn"><img src="chevron_backward_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"></button>
                    <button id="Forwardbtn"><img src="chevron_forward_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"></button>
                    <button id="moreOptions" onclick="showMoreOptions()"><img src="more_horiz_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>
                </form>
                <div class="todos-container">
                    <table id="task-list"></table>
                    <img src="task.png" class="empty-image" alt="empty">
                </div>
            </div>
        </div>
         <div id="list">
            <div class="listWidget">
                <h1>Neue Liste hinzufügen</h1>
                <form action="" class="list-input-area">
                    <input type="text" placeholder="Namen eingeben" id="list-input">
                </form>
                <button id="addListBtn">Hinzufügen</button>
                <button id="cancelListBtn" onclick="HideAddList()">Abbrechen</button>
            </div>
            <div class="test">
                <ul id="list-container"></ul>
            </div>
        </div>
        <div id="more">
            <div class="optionwidget">
                    <h1>Mehr Optionen</h1>
                    <button id="ToogleDarkMode"><img src="dark_mode_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"><p>Dark Mode on/off</p></button>
                    <button id="exportbtn" onclick="exportTableAsCSV('exportedTable.csv')"><img src="file_export_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"><p>Export List</p></button>
                    <button id="deletelist"><img src="delete_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""><p>Delete List</p></button>
                    <button id="closebtn" onclick="hideMoreOptions()"><img src="close_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">Close</button>
            </div>
        </div>
        <div id="toastnotifications"></div>
        <script src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    </body>
</html>
