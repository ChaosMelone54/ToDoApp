<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Easy Task</title>
        <link rel="stylesheet", href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="ToDo">
                <h1>Easy Task</h1>
                <div class="stat-container">
                    <div class="details">
                        <h3>Keep it Up</h3>
                        <div id="progressbar">
                            <div id="progress"></div>
                        </div>
                    </div>
                    <div class="stats-number">
                        <p id="numbers">0 / 0</p>
                    </div>
                </div>
                <form action="" class="input-area">
                    <input type="text" placeholder="Add a new task ..." id="task-input">
                    <select name="priority" id="priority">
                        <div class="selectionBox"><option value="Dringend">Dringend</option></div>
                        <div class="selectionBox"><option value="Wichtig">Wichtig</option></div>
                        <div class="selectionBox"><option value="Mittel">Mittel</option></div>
                        <div class="selectionBox"><option value="Niedrig">Niedrig</option></div>
                    </select>
                    <input type="date" name="date" id="date">
                    <button id="addTaskBtn"><img src="add_2_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"></button>
                    <label id="morelist" onclick="showAddList()">Neue Liste</label>
                    <button id="backwardbtn"><img src="chevron_backward_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"></button>
                    <button id="Forwardbtn"><img src="chevron_forward_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"></button>
                    <button id="ToogleDarkMode"><img src="dark_mode_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"></button>
                    <button id="exportbtn"><img src="file_export_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"></button>
                </form>
                <div class="todos-container">
                    <ul id="task-list"></ul>
                    <img src="task.png" class="empty-image" alt="empty">
                </div>
            </div>
        </div>
         <div id="list">
            <div class="listWidget">
                <h1>Neue Liste hinzufügen</h1>
                <form action="" class="list-input-area">
                    <input type="text" placeholder="Namen eingeben" id="list-input">
                </form>
                <button id="addListBtn">Hinzufügen</button>
                <button id="cancelListBtn" onclick="HideAddList()">Abbrechen</button>
            </div>
            <div class="test">
                <ul id="list-container"></ul>
            </div>
        </div>
        <script src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
    </body>
</html>
